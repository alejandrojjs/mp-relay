<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>iPadelApp - vinculación</title>
</head>
<body style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:0 16px;text-align:center">
  <h2>Un momento...</h2>
  <p id="msg">Terminando la vinculación con Mercado Pago.</p>
  <script>
    // SOLO PARA DESARROLLO. Mercado Pago exige una URL de redirección https pública; esta página estática la
    // cumple y reenvía el navegador (el de quien está probando) a su propio backend local. El backend no se
    // expone a internet. Sólo reenvía a localhost y sólo los parámetros code/state.
    var LOCAL_CALLBACK = 'http://localhost:4001/mp/oauth/callback';
    var p = new URLSearchParams(location.search);
    var out = new URLSearchParams();
    ['code', 'state'].forEach(function (k) { if (p.get(k)) out.set(k, p.get(k)); });
    if (out.has('code') && out.has('state')) {
      location.replace(LOCAL_CALLBACK + '?' + out.toString());
    } else {
      document.getElementById('msg').textContent = 'Faltan datos en la respuesta de Mercado Pago. Volvé a iniciar la vinculación desde la app.';
    }
  </script>
</body>
</html>
